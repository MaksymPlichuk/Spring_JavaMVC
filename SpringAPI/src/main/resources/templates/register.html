<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Реєстрація</title>
</head>
<body class="bg-gray-50 flex min-h-screen items-center justify-center p-4 antialiased font-sans">

<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-gray-100">

    <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Створення акаунту</h2>
        <p class="text-sm text-gray-500 mt-2">Будь ласка, заповніть форму нижче</p>
    </div>

    <!-- Приклад повідомлення про помилку -->

    <div class="mb-5 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg">
        <p class="text-sm text-red-700 font-medium">Такий email вже зареєстрований в системі</p>
    </div>


    <form action="#" method="POST" class="space-y-5" onsubmit="event.preventDefault();">

        <div>
            <label for="name" class="block text-sm font-semibold text-gray-700 mb-1.5">Ваше ім'я</label>
            <input type="text" id="name" name="name" placeholder="Іван"
                   class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 focus:outline-hidden focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"/>
        </div>

        <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-1.5">Електронна пошта</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com"
                   class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 focus:outline-hidden focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"/>
        </div>

        <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Пароль</label>
            <input type="password" id="password" name="password" placeholder="••••••••"
                   class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 focus:outline-hidden focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"/>
        </div>

        <button type="submit"
                class="w-full cursor-pointer bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:bg-blue-700 active:bg-blue-800 focus:outline-hidden focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors mt-2">
            Зареєструватися
        </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
        Вже маєте акаунт?
        <a href="/login" class="font-semibold text-blue-600 hover:text-blue-700 hover:underline transition-colors ml-1">Увійти</a>
    </div>

</div>

</body>
</html>
